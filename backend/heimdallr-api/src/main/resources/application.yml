spring:
  application:
    name: heimdallr-api
  flyway:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

---
spring:
  config:
    activate:
      on-profile: db
  datasource:
    url: ${HEIMDALLR_DB_URL:jdbc:postgresql://192.168.3.2:5432/heimdallr_monitor}
    username: ${HEIMDALLR_DB_USERNAME:monitor}
    password: ${HEIMDALLR_DB_PASSWORD:monitor_pass}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: filesystem:db-migration
