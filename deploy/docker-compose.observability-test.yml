name: heimdallr-observability-test

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: heimdallr-test-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-7d}
      - --web.enable-lifecycle
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - observability-test
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:11.3.1
    container_name: heimdallr-test-grafana
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3001}
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - elasticsearch
    networks:
      - observability-test
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.5
    container_name: heimdallr-test-elasticsearch
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms512m -Xmx512m}
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - observability-test
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.5
    container_name: heimdallr-test-logstash
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      LS_JAVA_OPTS: ${LS_JAVA_OPTS:--Xms256m -Xmx256m}
      XPACK_MONITORING_ENABLED: "false"
    ports:
      - "${LOGSTASH_HTTP_PORT:-8081}:8080"
      - "${LOGSTASH_BEATS_PORT:-5044}:5044"
    volumes:
      - ./observability/logstash/pipeline:/usr/share/logstash/pipeline:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - observability-test
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.5
    container_name: heimdallr-test-kibana
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      XPACK_SECURITY_ENABLED: "false"
      SERVER_PUBLICBASEURL: ${KIBANA_PUBLIC_BASE_URL:-http://localhost:5601}
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - observability-test
    restart: unless-stopped

  agent-gateway:
    image: nginx:1.27-alpine
    container_name: heimdallr-test-agent-gateway
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${AGENT_GATEWAY_PORT:-18080}:8080"
    volumes:
      - ./observability/agent-gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - observability-test
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

networks:
  observability-test:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
  elasticsearch-data:
