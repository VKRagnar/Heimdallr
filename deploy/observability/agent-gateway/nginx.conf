server {
  listen 8080;
  server_name _;

  default_type application/json;

  location = /health {
    return 200 '{"status":"UP","service":"agent-gateway","environment":"test"}';
  }

  location = /status {
    return 200 '{"agents":{"total":3,"online":3,"offline":0},"gateway":"ready"}';
  }

  location = /metrics {
    default_type text/plain;
    return 200 'agent_gateway_agents_total 3
agent_gateway_agents_online 3
agent_gateway_heartbeat_latency_seconds 0.042
';
  }
}
