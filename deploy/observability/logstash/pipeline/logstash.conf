input {
  http {
    host => "0.0.0.0"
    port => 8080
    codec => json
  }

  beats {
    port => 5044
  }
}

filter {
  if ![environment] {
    mutate {
      add_field => { "environment" => "test" }
    }
  }

  if ![service] {
    mutate {
      add_field => { "service" => "manual-test" }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "test-logs-%{+YYYY.MM.dd}"
  }

  stdout {
    codec => rubydebug
  }
}
