global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: test

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: agent-gateway
    metrics_path: /metrics
    static_configs:
      - targets:
          - agent-gateway:8080

  - job_name: heimdallr-api-local
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8080
    relabel_configs:
      - target_label: application
        replacement: heimdallr-api
